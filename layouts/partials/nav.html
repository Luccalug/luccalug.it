<nav class="nav" aria-label="Menu principale">
  {{- range .Site.Menus.main }}
    {{- if $.IsMenuCurrent "main" . }}
    <a href="{{ .URL }}" class="active" aria-current="page">{{ .Name }}</a>
    {{- else if $.HasMenuCurrent "main" . }}
    <a href="{{ .URL }}" class="active" aria-current="true">{{ .Name }}</a>
    {{- else }}
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
  {{- end }}
</nav>
