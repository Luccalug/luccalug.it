baseURL = "https://luccalug.it/"
defaultContentLanguage = "it"
title = "Luccalug - Lucca Linux User Group"
enableRobotsTXT = true
enableGitInfo = false
timeZone = "Europe/Rome"

[languages]
  [languages.it]
    label = "Italiano"
    locale = "it-IT"
    weight = 1

# Last-modified date comes from the front matter, not from git: mass commits
# (migrations, link fixes) would otherwise mark old articles as just updated.
# Add `lastmod: YYYY-MM-DD` only when a page's content really changes.
[frontmatter]
  lastmod = ["lastmod", "date"]

[pagination]
  pagerSize = 10

[params]
  description = "Il Linux User Group di Lucca"
  shortTitle = "Luccalug"
  marqueeText = "★ Benvenuti su Luccalug - Lucca Linux User Group! ★ Software libero, conoscenza condivisa, pinguini felici! ★"
  visitorCounterSeed = 1337
  # Used in the structured data (JSON-LD) of the home page.
  email = "luccalug@protonmail.com"
  social = ["https://t.me/luccalug"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputs]
  home = ["HTML", "RSS", "MD", "llms", "llms-full"]
  section = ["HTML", "RSS", "MD"]
  page = ["HTML", "MD"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[outputFormats.MD]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.llms-full]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true

[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.ical]
  mediaType = "text/calendar"
  baseName = "calendario"
  isPlainText = true
  notAlternative = true

[taxonomies]
  tag = "tags"

[permalinks]
  [permalinks.page]
    blog = "/blog/:year/:month/:slug/"
  [permalinks.section]
    blog = "/blog/"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Chi siamo"
    pageRef = "/about"
    weight = 2
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 3
  [[menus.main]]
    name = "Archivio"
    pageRef = "/archivio"
    weight = 4
  [[menus.main]]
    name = "Calendario"
    pageRef = "/calendario"
    weight = 5
  [[menus.main]]
    name = "Linux Day"
    pageRef = "/linux-day"
    weight = 6
  [[menus.main]]
    name = "Contatti"
    pageRef = "/contatti"
    weight = 7
