name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: 'content/**/*.md'

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: 'content/**/*.md'
          strict: false

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - uses: actions/cache@v4
        with:
          path: resources
          key: hugo-images-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-

      - run: hugo --minify --baseURL "https://luccalug.it/"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --root-dir ./public --no-progress ./public
          fail: false

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, link-check]
    steps:
      - uses: actions/checkout@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - uses: actions/cache@v4
        with:
          path: resources
          key: hugo-images-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-

      - run: hugo --minify --baseURL "https://luccalug.it/"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
