name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: 'content/**/*.md'

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: 'content/**/*.md'
          language: it,en

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - uses: actions/cache@v4
        with:
          path: resources
          key: hugo-images-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-

      - run: hugo --minify --baseURL "https://luccalug.it/"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--no-progress ./public'
          fail: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, link-check]
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - uses: actions/cache@v4
        with:
          path: resources
          key: hugo-images-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-

      - uses: actions/configure-pages@v5
        id: pages

      - run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
