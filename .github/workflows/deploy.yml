name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [master]
  # Pull requests get lint and link checks, but are never deployed.
  pull_request:
  # Nightly rebuild: drops past events from the calendar page.
  # 03:30 UTC is 04:30/05:30 in Italy, so the UTC and Italian dates match.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Read-only by default; only the deploy job gets write access.
permissions:
  contents: read

# Keep in sync with the Hugo version used locally (`hugo version`).
env:
  HUGO_VERSION: '0.169.0'

# One queue per branch or PR, so a pull request never cancels a deploy of master.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA (version in the comment); Dependabot
# updates both, see .github/dependabot.yml.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: 'content/**/*.md'

      # The Italian dictionary is not bundled with cspell: install it so that
      # the "import" in cspell.json resolves from ./node_modules.
      - name: Install Italian dictionary
        run: npm install --no-save --no-package-lock --no-audit --no-fund @cspell/dict-it-it@3.1.7

      - name: Spell check
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: 'content/**/*.md'
          strict: false

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: hugo-images-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-${{ env.HUGO_VERSION }}-

      - run: hugo --minify --baseURL "https://luccalug.it/"

      # Internal links and #anchors, checked offline against the build: blocking.
      # Absolute links to the site (e.g. from ref/relref) are mapped to ./public.
      - name: Link check (internal links and anchors)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments
            --root-dir ${{ github.workspace }}/public
            --remap '^https://luccalug\.it/(.*)$ file://${{ github.workspace }}/public/$1'
            --index-files index.html
            --no-progress './public/**/*.html'
          fail: true

      # External links: reported but not blocking, remote sites come and go.
      - name: Link check (external links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --root-dir ./public --no-progress ./public
          fail: false

  deploy:
    # Only master is published: not pull requests, not manual runs on other branches.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [lint, link-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: hugo-images-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/images/**') }}
          restore-keys: hugo-images-${{ env.HUGO_VERSION }}-

      - run: hugo --minify --baseURL "https://luccalug.it/"

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
