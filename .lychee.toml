# Lychee link checker configuration
exclude_path = ["public/feed.xml", "public/sitemap.xml"]

# Skip mailto and tel links
exclude = [
    '^mailto:',
    '^tel:',
    # Skip internal links (they point to the live site, not the local build)
    '^https://luccalug\.it/',
]

# Accept 429 (rate limited) as valid
accept = [200, 429]

# Check the rendered site only; Markdown, feeds and llms-full duplicate the same links
extensions = ["html", "css"]

# Keep slow or redirecting historical sites from holding up the pipeline
timeout = 10
max_retries = 0
max_redirects = 3

# Max concurrent requests
max_concurrency = 16
